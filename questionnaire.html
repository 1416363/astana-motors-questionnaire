<title>Опросник Astana Motors</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap">
<style>
.amq{--bg:#FFFFFF;--ink:#111111;--ink-2:#5B5B58;--ink-3:#8E8E8B;
 --rule:#E8E7E4;--hover:#EFEEEB;--field:#F5F5F3;--line:#E0DFDC;
 --accent:#2E7CC4;--done:#3E7A5C;
 background:var(--bg);color:var(--ink);
 font-family:"Google Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
 font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;
 max-width:1100px;margin:0 auto;padding:56px 24px 120px;box-sizing:border-box}
.amq *{box-sizing:border-box}
.amq .super{font-size:13px;color:var(--ink-3);margin:0 0 24px}
.amq h1{font-weight:700;font-size:38px;line-height:1.15;margin:0;letter-spacing:-.02em;color:var(--ink)}
.amq .sub{font-size:16px;color:var(--ink-2);margin:10px 0 0}
.amq .layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:52px;align-items:start;margin-top:40px}
@media (max-width:900px){.amq .layout{grid-template-columns:1fr;gap:28px}}
.amq nav{position:sticky;top:20px;display:flex;flex-direction:column}
@media (max-width:900px){.amq nav{position:static}}
.amq nav h3{font-size:15px;font-weight:700;color:#000;margin:0 0 12px;padding:0 8px}
.amq nav a{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:baseline;
 padding:7px 8px;border-radius:4px;text-decoration:none;color:var(--ink-2);font-size:13.5px}
.amq nav a:hover{background:var(--hover)}
.amq nav .cnt{font-size:12px;color:var(--ink-3)}
.amq nav a.full .cnt{color:var(--done)}
.amq section{margin:0 0 56px;scroll-margin-top:20px}
.amq h2{font-weight:700;font-size:23px;margin:0 0 16px;letter-spacing:-.01em;color:var(--ink)}
.amq .row{border-bottom:1px solid var(--rule);padding:13px 0}
.amq .ans{margin-top:8px;padding-left:36px}
@media (max-width:520px){.amq .ans{padding-left:0}}
.amq .ask{display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px}
.amq .n{font-size:12.5px;color:var(--ink-3);padding-top:3px}
.amq .ask p{margin:0}
.amq textarea{display:block;width:100%;min-height:32px;resize:none;overflow:hidden;
 font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);
 border-radius:4px;padding:5px 8px}
.amq textarea:hover{background:var(--hover)}
.amq textarea:focus{outline:none;border-color:var(--accent);background:var(--bg)}
.amq textarea::placeholder{color:var(--ink-3)}
@media (prefers-reduced-motion:reduce){.amq *{transition:none!important}}
</style>

<div class="amq">
 <p class="super">mastakey systems + raft</p>
 <h1>Автоматизация кол-центра Astana Motors</h1>
 <p class="sub">Вопросник для определения условий задачи</p>
 <div id="amq-беда" style="display:none;background:#FBEAEA;color:#7A2E2E;padding:10px 14px;border-radius:6px;margin-bottom:16px">Ответы сейчас не сохраняются. Проверьте связь — как только она появится, сохранение продолжится само.</div>
<div id="amq-ждём" style="display:none;color:#5B5B58;padding:10px 0;margin-bottom:8px">Загружаю вопросы…</div>
<div class="layout">
  <nav id="amq-toc"><h3>Оглавление</h3></nav>
  <main id="amq-main"></main>
 </div>
</div>

<script>
(function(){
 var ПРИЁМНИК="https://script.google.com/macros/s/AKfycbx-SuVmX-KgWlzlZd80C04biG8jRFQN9s8IhFesHk_XJoASak3lPXU1A61BZLxmEVvI/exec";
 var КЕГЛИ=[15,14,13];
 var ХРАН="amq2";
 var главы=[], сост={}, правки={}, ссылки=[], таймер=null;

 function э(t,к,тк){var e=document.createElement(t); if(к)e.className=к; if(тк!==undefined)e.textContent=тк; return e;}

 function подогнать(ta){
   var д=(ta.value||"").length, к=д<=160?КЕГЛИ[0]:(д<=300?КЕГЛИ[1]:КЕГЛИ[2]);
   ta.style.fontSize=к+"px"; ta.style.lineHeight="1.45"; ta.style.height="auto";
   ta.style.height=(ta.scrollHeight+(ta.offsetHeight-ta.clientHeight))+"px";
 }
 function сохранить(){ try{localStorage.setItem(ХРАН,JSON.stringify(сост));}catch(e){} }
 function загрузить(){ try{сост=JSON.parse(localStorage.getItem(ХРАН)||"{}");}catch(e){сост={};} }

 // Пустая ячейка «Глава» означает продолжение предыдущего раздела.
 // Ведущий номер в названии раздела отбрасывается — страница нумерует разделы сама.
 function разобрать(пункты){
   var г=[], тек=null;
   пункты.forEach(function(п){
     var имя=String(п.глава||"").replace(/^\s*\d+\s*[.)]\s*/,"").trim();
     if(имя){ if(!тек || тек.имя!==имя){ тек={имя:имя, пункты:[]}; г.push(тек); } }
     else if(!тек){ тек={имя:"", пункты:[]}; г.push(тек); }
     тек.пункты.push(п);
   });
   return г;
 }

 function отрисовать(){
   var main=document.getElementById("amq-main"), toc=document.getElementById("amq-toc");
   main.innerHTML=""; toc.innerHTML=""; ссылки=[];
   toc.appendChild(э("h3",null,"Оглавление"));
   var ном=0;
   главы.forEach(function(б,ном_гл){
     б.id="g"+(ном_гл+1);
     var н=(ном_гл+1)+". ";
     var a=э("a"); a.href="#"+б.id;
     a.appendChild(э("span",null,н+б.имя)); a.appendChild(э("span","cnt",""));
     toc.appendChild(a); ссылки.push({б:б,a:a});
     var s=э("section"); s.id=б.id; s.appendChild(э("h2",null,н+б.имя));
     б.пункты.forEach(function(п){
       var n=++ном, r=э("div","row"), ask=э("div","ask");
       ask.appendChild(э("div","n",String(n)));
       var wrap=э("div"); wrap.appendChild(э("p",null,п.вопрос)); ask.appendChild(wrap); r.appendChild(ask);
       var ключ="с"+п.строка, ans=э("div","ans"), ta=э("textarea");
       ta.rows=1; ta.placeholder="Ответ"; ta.dataset.k=ключ; ta.dataset.g=б.id;
       ta.value=(ключ in сост)?сост[ключ]:(п.ответ||"");
       ta.addEventListener("input",function(){подогнать(ta); сост[ключ]=ta.value; правки[ключ]=1; сохранить(); счёт(); отложить();});
       ans.appendChild(ta); r.appendChild(ans); s.appendChild(r);
     });
     main.appendChild(s);
   });
   [].forEach.call(document.querySelectorAll(".amq textarea"),подогнать);
 }

 function счёт(){
   ссылки.forEach(function(п){
     var поля=document.querySelectorAll('.amq [data-g="'+п.б.id+'"]'), г=0;
     [].forEach.call(поля,function(t){ if((t.value||"").trim()) г++; });
     п.a.querySelector(".cnt").textContent=г+"/"+поля.length;
     п.a.className=(г===поля.length&&поля.length)?"full":"";
   });
 }

 function поле(ключ){ return document.querySelector('.amq [data-k="'+ключ+'"]'); }
 function собрать(){
   var о=[];
   for(var к in правки){ var п=поле(к); if(п) о.push({строка:Number(к.slice(1)), ответ:п.value}); }
   return о;
 }
 function беда(есть){
   var э2=document.getElementById("amq-беда");
   if(э2) э2.style.display = есть ? "block" : "none";
 }
 function отправить(){
   var посылка=собрать();
   if(!посылка.length) return;
   fetch(ПРИЁМНИК,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},
     body:JSON.stringify({ответы:посылка})})
    .then(function(о){return о.json();})
    .then(function(р){
      var ок=!!(р&&р.ок); беда(!ок);
      if(ок){
        посылка.forEach(function(п){
          var к="с"+п.строка, э2=поле(к);
          if(э2 && э2.value===п.ответ){ delete правки[к]; delete сост[к]; }
        });
        сохранить();
      }
    })
    .catch(function(){ беда(true); });
 }
 function отложить(){ clearTimeout(таймер); таймер=setTimeout(отправить,1500); }

 function ждём(текст){
   var э2=document.getElementById("amq-ждём");
   if(!э2) return;
   if(текст===null){ э2.style.display="none"; return; }
   э2.style.display="block"; э2.textContent=текст;
 }

 function получить(){
   ждём("Загружаю вопросы…");
   fetch(ПРИЁМНИК+"?t="+Date.now(),{method:"GET"})
    .then(function(о){ if(!о.ok) throw new Error(о.status); return о.json(); })
    .then(function(р){
      if(!р||!р.ок) throw new Error(р&&р.ошибка?р.ошибка:"нет ответа");
      главы=разобрать(р.пункты||[]);
      if(!главы.length){ ждём("В таблице пока нет вопросов."); return; }
      ждём(null); отрисовать(); счёт();
      if(document.fonts&&document.fonts.ready) document.fonts.ready.then(function(){
        [].forEach.call(document.querySelectorAll(".amq textarea"),подогнать);});
    })
    .catch(function(){ ждём("Вопросы не загрузились. Обновите страницу."); });
 }

 загрузить();
 получить();
 window.addEventListener("resize",function(){
   [].forEach.call(document.querySelectorAll(".amq textarea"),подогнать);});
})();
</script>
