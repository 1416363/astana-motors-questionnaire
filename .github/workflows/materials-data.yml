name: Данные запроса материалов

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Забрать присланное из таблицы
        run: |
          curl -sL --max-time 60 \
            "https://script.google.com/macros/s/AKfycbxOiycJ5ulXXB_9NyTxBj7ZWLAmy3jaiFgyTh3CTiqXCl847kfNYBjWib1klngjedN-/exec" \
            -o new.json
          python3 - <<'PY'
          import json, sys
          д = json.load(open("new.json", encoding="utf-8"))
          if not д.get("ок"):
              print("приёмник ответил отказом, файл не меняем")
              sys.exit(1)
          json.dump(д, open("materials-data.json", "w", encoding="utf-8"),
                    ensure_ascii=False, indent=1)
          print("файлов %s, ссылок %s, вопросов %s" % (д.get("файлов"), д.get("ссылок"), д.get("вопросов")))
          PY
          rm -f new.json

      - name: Записать, если изменилось
        run: |
          git config user.name "Данные запроса материалов"
          git config user.email "actions@github.com"
          git add materials-data.json
          git diff --staged --quiet && echo "изменений нет" && exit 0
          git commit -m "Данные запроса материалов на $(date -u '+%d.%m.%Y %H:%M') по Гринвичу"
          git push
